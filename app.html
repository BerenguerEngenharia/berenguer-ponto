<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1B2147"/>
<title>Berenguer — Controle de Ponto</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#10152E;font-family:'Barlow',sans-serif;color:#E8ECF8;overscroll-behavior-y:contain;-webkit-text-size-adjust:100%;}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-family:inherit;}
button:active{opacity:.82;transform:scale(.96);}
input,select{font-family:inherit;}
select option{background:#1F2755;}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.5)sepia(1)hue-rotate(190deg)brightness(1.2);}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:#10152E;}
::-webkit-scrollbar-thumb{background:#323D7A;border-radius:4px;}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
#root{min-height:100%;background:#10152E;}
</style>
</head>
